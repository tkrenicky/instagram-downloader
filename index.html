<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram Public Downloader</title>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#0b0b0f;color:#eee;margin:0}
.wrap{max-width:760px;margin:7vh auto;padding:24px}.card{background:#15151c;border:1px solid #2a2a35;border-radius:18px;padding:24px;box-shadow:0 14px 50px #0005}
h1{margin-top:0}.sub{color:#bbb;line-height:1.5}label{display:block;margin:18px 0 6px;color:#bbb}
input,button{width:100%;box-sizing:border-box;border-radius:12px;border:1px solid #343442;padding:13px 14px;font-size:16px;background:#0f0f15;color:#fff}
button{margin-top:20px;background:#fff;color:#111;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:default}
small{color:#9292a0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.msg{margin-top:16px;white-space:pre-wrap;color:#c7c7d2;line-height:1.45}
.bar{height:10px;background:#272733;border-radius:20px;overflow:hidden;margin-top:14px}.fill{height:100%;width:0;background:#eee;transition:.2s}
.warn{color:#ffcf70}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body><div class="wrap"><div class="card">
<h1>Instagram Public Downloader</h1>
<p class="sub">Stáhne obrázky z veřejného profilu včetně carouselů. U videí ukládá pouze statický náhled jako JPG. Umí i Highlights (uložené Stories).</p>
<label>Instagram username</label><input id="u" placeholder="např. natgeo">
<label>Instagram sessionid <span class="warn">(pro Highlights obvykle nutný)</span></label>
<input id="s" type="password" autocomplete="off" placeholder="volitelné pro feed, doporučené pro Highlights">
<small>Session se použije jen během požadavku a aplikace ji nikam neukládá ani neloguje.</small>
<div class="row"><div><label>Feed</label><input id="feed" type="checkbox" checked style="width:auto"></div><div><label>Highlights</label><input id="hl" type="checkbox" checked style="width:auto"></div></div>
<button id="go">Stáhnout všechny fotky jako ZIP</button>
<div class="bar"><div class="fill" id="fill"></div></div><div id="m" class="msg"></div>
</div></div>
<script>
const m=document.getElementById('m'),go=document.getElementById('go'),fill=document.getElementById('fill');
function setp(n,t){fill.style.width=(t?Math.round(n/t*100):0)+'%'}
go.onclick=async()=>{
 const username=document.getElementById('u').value.trim().replace(/^@/,'');
 if(!username){m.textContent='Zadej username.';return}
 go.disabled=true; setp(0,1); m.textContent='Načítám kompletní seznam médií z Instagramu…';
 try{
  const r=await fetch('/api/list',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
   username,sessionid:document.getElementById('s').value.trim(),
   feed:document.getElementById('feed').checked,highlights:document.getElementById('hl').checked
  })});
  const data=await r.json().catch(()=>({error:'Neplatná odpověď serveru'}));
  if(!r.ok) throw new Error(data.error||('HTTP '+r.status));
  const items=data.items||[];
  if(!items.length) throw new Error((data.warnings||[]).join('\n')||'Nebyly nalezeny žádné obrázky.');
  m.textContent='Nalezeno '+items.length+' obrázků. Stahuji 0/'+items.length+'…'+((data.warnings||[]).length?'\n'+data.warnings.join('\n'):'');
  const zip=new JSZip();
  for(let i=0;i<items.length;i++){
    const it=items[i];
    const rr=await fetch('/api/media?url='+encodeURIComponent(it.url));
    if(!rr.ok) throw new Error('Stažení média '+(i+1)+' selhalo (HTTP '+rr.status+').');
    zip.file(it.path,await rr.blob());
    setp(i+1,items.length);
    m.textContent='Nalezeno '+items.length+' obrázků. Stahuji '+(i+1)+'/'+items.length+'…'+((data.warnings||[]).length?'\n'+data.warnings.join('\n'):'');
  }
  m.textContent='Vytvářím ZIP…';
  const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:4}});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=username+'_instagram.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
  m.textContent='Hotovo — '+items.length+' obrázků.';
 }catch(e){m.textContent='Chyba: '+e.message}
 finally{go.disabled=false}
};
</script></body></html>
