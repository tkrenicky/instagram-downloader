<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instagram Highlights Downloader</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>body{font-family:Inter,system-ui,sans-serif;background:#0b0b0f;color:#eee;margin:0}.wrap{max-width:760px;margin:7vh auto;padding:24px}.card{background:#15151c;border:1px solid #2a2a35;border-radius:18px;padding:28px}h1{margin-top:0}.sub{color:#aaa;line-height:1.55}label{display:block;margin:18px 0 7px;color:#bbb}input,button{width:100%;box-sizing:border-box;border-radius:11px;border:1px solid #383845;padding:13px;font-size:16px;background:#0f0f15;color:#fff}button{background:#fff;color:#111;font-weight:800;cursor:pointer;margin-top:16px}button:disabled{opacity:.5}#m{white-space:pre-wrap;margin-top:16px;color:#ccc;line-height:1.5}.progress{height:10px;background:#292934;border-radius:99px;overflow:hidden;margin-top:16px}.fill{height:100%;width:0;background:#eee;transition:.2s}</style></head><body><div class="wrap"><div class="card"><h1>Instagram Highlights ZIP</h1><p class="sub">Zadej veřejný Instagram profil. Bez Apify, bez rozšíření, bez přihlášení a bez dalších kroků.</p><label>Instagram username</label><input id="u" placeholder="např. luciepucka"><button id="go">Stáhnout všechny Highlights jako ZIP</button><div class="progress"><div id="fill" class="fill"></div></div><div id="m"></div></div></div><script>const u=document.getElementById('u'),go=document.getElementById('go'),m=document.getElementById('m'),fill=document.getElementById('fill');const safe=s=>String(s||'instagram').replace(/[^A-Za-z0-9._-]+/g,'_').slice(0,100);go.onclick=async()=>{const username=u.value.trim().replace(/^@/,'');if(!username){m.textContent='Zadej username.';return}go.disabled=true;fill.style.width='0%';try{m.textContent='Načítám veřejné Highlights přímo z Instagramu…';const r=await fetch('/api/direct',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username})});const j=await r.json().catch(()=>({error:'Neplatná odpověď serveru'}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));let items=j.items||[];if(!items.length)throw new Error(j.message||'Nenašel jsem žádné veřejně dostupné obrázky v Highlights.');m.textContent='Nalezeno '+items.length+' obrázků. Stahuji…';const zip=new JSZip();let ok=0,err=0;for(let i=0;i<items.length;i++){try{const x=await fetch('/api/proxy?url='+encodeURIComponent(items[i].url));if(!x.ok)throw new Error('HTTP '+x.status);zip.file(items[i].path||('highlight_'+(i+1)+'.jpg'),await x.blob());ok++}catch(_){err++}fill.style.width=Math.round((i+1)/items.length*100)+'%';m.textContent='Stahuji '+(i+1)+'/'+items.length+' | OK '+ok+' | chyby '+err}if(!ok)throw new Error('Instagram média byla nalezena, ale nepodařilo se stáhnout žádný obrázek.');m.textContent='Vytvářím ZIP…';const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:4}});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=safe(username)+'_highlights.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);m.textContent='Hotovo. V ZIPu '+ok+' obrázků'+(err?' | chyby '+err:'')+'.'}catch(e){m.textContent='Chyba: '+e.message}finally{go.disabled=false}};</script></body></html>
