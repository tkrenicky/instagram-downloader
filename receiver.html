<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instagram Highlights ZIP</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>body{font-family:Inter,system-ui,sans-serif;background:#0b0b0f;color:#eee;margin:0}.wrap{max-width:760px;margin:7vh auto;padding:24px}.card{background:#15151c;border:1px solid #2a2a35;border-radius:18px;padding:26px}#m{white-space:pre-wrap;color:#ccc;line-height:1.5}.progress{height:10px;background:#292934;border-radius:99px;overflow:hidden;margin-top:16px}.fill{height:100%;width:0;background:#eee;transition:.2s}</style></head><body><div class="wrap"><div class="card"><h1>Instagram Highlights</h1><div id="m">Čekám na data z Instagramu…</div><div class="progress"><div class="fill" id="fill"></div></div></div></div><script>const m=document.getElementById('m'),fill=document.getElementById('fill');const safe=s=>String(s||'item').replace(/[^A-Za-z0-9._-]+/g,'_').slice(0,100);try{window.opener?.postMessage({type:'IG_RECEIVER_READY'},'https://www.instagram.com')}catch(_){}window.addEventListener('message',async e=>{if(e.origin!=='https://www.instagram.com'||e.data?.type!=='IG_HIGHLIGHTS_DATA')return;let items=e.data.items||[];const username=e.data.username||'instagram';const seen=new Set();items=items.filter(x=>x.url&&!seen.has(x.url)&&seen.add(x.url));if(!items.length){m.textContent='Instagram nevrátil žádné obrázky.';return;}const zip=new JSZip();let ok=0,err=0;for(let i=0;i<items.length;i++){try{const r=await fetch('/api/proxy?url='+encodeURIComponent(items[i].url));if(!r.ok)throw new Error('HTTP '+r.status);zip.file(items[i].path||('highlight_'+(i+1)+'.jpg'),await r.blob());ok++;}catch(_){err++;}fill.style.width=Math.round((i+1)/items.length*100)+'%';m.textContent='Stahuji '+(i+1)+'/'+items.length+' | OK '+ok+' | chyby '+err;}if(!ok){m.textContent='Nepodařilo se stáhnout žádný obrázek.';return;}m.textContent='Vytvářím ZIP…';const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:4}});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=safe(username)+'_highlights.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);m.textContent='Hotovo. V ZIPu '+ok+' obrázků'+(err?' | chyby '+err:'')+'.';});</script></body></html>
